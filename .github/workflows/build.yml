name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify build and tests
        run: xvfb-run -a bash mvnw -B -ntp clean install -Dcheckstyle.skip

      - name: Smoke test server
        run: |
          java -jar server/target/server-0.0.1-SNAPSHOT.jar > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/api/recipes/ > /dev/null; then
              echo "Server started successfully"
              exit 0
            fi
            sleep 1
          done

          cat server.log
          exit 1

      - name: Smoke test JavaFX client
        run: |
          java -jar server/target/server-0.0.1-SNAPSHOT.jar > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/api/recipes/ > /dev/null; then
              break
            fi
            sleep 1
          done

          set +e
          timeout 20s xvfb-run -a bash mvnw -B -ntp -pl client javafx:run > client.log 2>&1
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 124 ]; then
            echo "Client remained running for the smoke-test window"
            exit 0
          fi

          cat client.log
          exit $STATUS
